# CI backend: install, unit test, integration test (MySQL 8 sebagai service).
# E2E Selenium tidak dijalankan di sini: butuh kedua repo, Chrome, dan database uji berisi akun admin;
# jalankan secara lokal (lihat frontend/e2e/README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit test
        run: npm test
      - name: mysqldump untuk test backup
        run: command -v mysqldump || (sudo apt-get update && sudo apt-get install -y mysql-client)
      - name: Integration test
        run: npm run test:integration
